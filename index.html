<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notes Organizer</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:#07111f;color:#f8fafc}main{max-width:1120px;margin:auto;padding:44px 20px}.badge{display:inline-block;padding:8px 12px;border-radius:999px;border:1px solid #ffffff22;color:#bfdbfe;background:#ffffff0d;font-weight:800}h1{font-size:clamp(40px,7vw,72px);line-height:.95;letter-spacing:-.06em;margin:16px 0}p{color:#9fb0c7;font-size:18px;line-height:1.6}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#ffffff0d;border:1px solid #ffffff1a;border-radius:28px;padding:22px;box-shadow:0 24px 80px #0007}textarea{width:100%;min-height:280px;border:1px solid #334155;background:#020617;color:white;border-radius:18px;padding:16px;font-size:15px;line-height:1.6}button{border:0;border-radius:16px;background:linear-gradient(135deg,#38bdf8,#22c55e);color:#061014;font-weight:900;padding:14px 18px;cursor:pointer;margin-top:14px}.box{padding:16px;border:1px solid #1e293b;border-radius:18px;background:#020617;margin:12px 0}.label{color:#93c5fd;font-size:12px;text-transform:uppercase;font-weight:900}@media(max-width:850px){.grid{grid-template-columns:1fr}}</style></head><body><main><span class="badge">Productivity Tool</span><h1>Notes Organizer</h1><p>Paste raw notes and turn them into a summary, action list, and follow-up plan.</p><section class="grid"><div class="card"><h2>Raw notes</h2><textarea id="notes">Discussed product launch timeline. Jerry will prepare portfolio screenshots. Team should review landing page copy. Need follow-up on GitHub pages setup and demo links by Friday.</textarea><button onclick="organize()">Organize notes</button></div><div class="card"><h2>Organized output</h2><div id="output"></div></div></section></main><script>function organize(){const text=notes.value.trim();const sentences=text.split(/[.!?]/).map(x=>x.trim()).filter(Boolean);const actions=sentences.filter(s=>/will|should|need|follow-up|prepare|review|setup/i.test(s));output.innerHTML=`<div class="box"><div class="label">Summary</div><p>${sentences.slice(0,2).join('. ')}.</p></div><div class="box"><div class="label">Action items</div><ul>${actions.map(a=>`<li>${a}</li>`).join('')||'<li>No clear action items found.</li>'}</ul></div><div class="box"><div class="label">Follow-up plan</div><p>Review the action list, assign owners, and confirm deadlines in the next check-in.</p></div>`}organize()</script></body></html>
